<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Ethical Multimedia GH</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="logo" href="/">Ethical <span>Multimedia GH</span></a><button class="menu-btn">☰</button><nav class="nav-links"><a href="/">Home</a><a href="/services.html">Services</a><a href="/about.html">About</a><a class="active" href="/contact.html">Contact</a><a href="/social.html">Social Hub</a></nav></div></header>
<main>
<section class="page-hero"><div class="container"><p class="kicker">Contact</p><h1>Book Ethical Multimedia GH</h1><p>Tell us about your event and we will follow up with availability and package options.</p></div></section>
<section class="section"><div class="container">
  <form id="contact-form" class="card" novalidate>
    <div class="form-grid">
      <p><label for="name">Full Name</label><input id="name" name="name" required minlength="2" /></p>
      <p><label for="email">Email Address</label><input id="email" name="email" type="email" required /></p>
      <p><label for="phone">Phone</label><input id="phone" name="phone" /></p>
      <p><label for="service">Service Needed</label><select id="service" name="service"><option value="">Select a service</option><option>Live Band</option><option>Catering</option><option>Decor</option><option>Multimedia</option><option>Full Package</option></select></p>
      <p><label for="eventDate">Event Date</label><input id="eventDate" name="eventDate" type="date" /></p>
      <p style="display:none"><label for="website">Website</label><input id="website" name="website" autocomplete="off" tabindex="-1" /></p>
    </div>
    <p><label for="message">Event Details</label><textarea id="message" name="message" required minlength="10" placeholder="Share your event type, location, guest count, and preferred services."></textarea></p>
    <button class="btn btn-primary" type="submit">Send Inquiry</button>
    <p id="form-notice" class="notice" aria-live="polite"></p>
  </form>
</div></section>
</main>
<footer class="footer"><div class="container"><p>Email notifications are enabled when CONTACT_TO_EMAIL and sendmail are configured on the server.</p></div></footer>
<script src="/script.js" defer></script>
</body>
</html>
